project:
  type: book
  output-dir: docs

book:
  title: "Glycoverse Tutorials"
  subtitle: "A practical guide to glycomics and glycoproteomics"
  site-url: https://glycoverse.github.io/glycoverse-tutorial/
  repo-url: https://github.com/glycoverse/glycoverse-tutorial
  repo-actions: [edit, issue]
  search: true
  page-navigation: true
  sidebar:
    style: docked
    collapse-level: 2
  chapters:
    - index.qmd
    - part: case-studies/index.qmd
      chapters:
        - tutorials/glycomics.Rmd
        - tutorials/glycoproteomics.Rmd
    - how-to/index.qmd

format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: true
    toc-depth: 3
    number-sections: true
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: true

execute:
  freeze: auto
